{% extends "base.html" %}
{% block title %}Live Results — Maigret{% endblock %}
{% block content %}
<style>
    #graph {
        block-size: 560px;
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        background: var(--surface-card);
    }

    .live-stats {
        display: flex;
        gap: 1.25rem;
        flex-wrap: wrap;
        align-items: center;
        margin-block-end: 0.75rem;
    }

    .kw-hit-badge {
        display: inline-block;
        padding: 0.1rem 0.45rem;
        border-radius: 4px;
        background-color: #16a34a;
        color: #ffffff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.78rem;
        font-weight: 700;
    }

    .live-hits-panel {
        margin-block-start: 1.25rem;
        background-color: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 1rem;
    }

    .live-hits-list {
        list-style: none;
        padding: 0;
        margin: 0.5rem 0 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 0.5rem;
    }

    .live-hit-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.45rem 0.65rem;
        border-radius: 6px;
        background-color: var(--surface-subtle);
        border: 1px solid var(--border-subtle);
        min-inline-size: 0;
    }

    .live-hit-item a {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
</style>

<div class="form-container">
    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <h1 class="h2 mb-0">Live Results</h1>
        <div class="d-flex gap-2">
            <a id="analyzeBtn" href="#" class="btn btn-warning" style="display:none;">Analyze</a>
            <button type="button" id="stopBtn" class="btn btn-danger">Stop</button>
        </div>
    </div>
    <div class="live-stats" aria-live="polite">
        <span id="live-status" class="text-muted">Starting…</span>
        <span>Checked: <strong id="stat-checked">0</strong> / <span id="stat-total">?</span></span>
        <span>Found: <strong id="stat-found">0</strong></span>
        <span>Keyword <code>[++]</code>: <strong id="stat-keywords">0</strong></span>
        <span>Errors: <strong id="stat-errors">0</strong></span>
    </div>
    <div class="progress mb-3" style="height: 8px;">
        <div id="live-progress" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <div id="graph"></div>
    <p class="text-muted mt-2" style="font-size: 0.85rem;">Double-click a site node to open the profile.</p>

    <section class="live-hits-panel" aria-labelledby="live-hits-heading">
        <h2 id="live-hits-heading" class="h5 mb-0">Detected Profiles</h2>
        <ul id="live-hits" class="live-hits-list"></ul>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>

<script>
    const jobId = {{ job_id|tojson }};
    const doneRedirect = {{ done_redirect|tojson }};
    const doneFoundCount = {{ done_found_count | default(0) | tojson }};

    let nodes = null, edges = null, network = null;
    let foundCount = doneRedirect ? doneFoundCount : 0;
    let keywordCount = 0;
    let errorCount = 0;
    let evtSource = null;
    let streamFinished = false;

    function ensureGraph() {
        if (network) return;
        nodes = new vis.DataSet();
        edges = new vis.DataSet();
        network = new vis.Network(document.getElementById('graph'), { nodes, edges }, {
            nodes: { shape: 'dot', size: 14, font: { color: '#dee2e6' } },
            edges: { color: { color: '#64748b' }, smooth: false },
            physics: {
                solver: 'forceAtlas2Based',
                forceAtlas2Based: { gravitationalConstant: -60, springLength: 110 },
                stabilization: { iterations: 150 },
            },
            groups: {
                username: { color: '#f9cf00', shape: 'star', size: 22 },
                site: { color: '#28a745' },
                site_kw: { color: { background: '#22c55e', border: '#bbf7d0' }, borderWidth: 3, size: 18 },
                data: { color: '#214e7b', shape: 'box' },
            },
        });
        network.on('doubleClick', function (params) {
            if (params.nodes.length) {
                const n = nodes.get(params.nodes[0]);
                if (n && n.url) window.open(n.url, '_blank', 'noopener');
            }
        });
    }

    function addNode(id, label, group, extra) {
        if (!nodes.get(id)) nodes.add(Object.assign({ id, label, group }, extra || {}));
    }

    function addEdge(from, to) {
        const id = from + '->' + to;
        if (!edges.get(id)) edges.add({ id, from, to });
    }

    const SKIP_ID = /(_count$|^is_|_at$|image|avatar|thumbnail)/i;

    function shortLabel(s) {
        s = String(s);
        return s.length > 28 ? s.slice(0, 27) + '…' : s;
    }

    function appendLiveHit(ev) {
        const list = document.getElementById('live-hits');
        const li = document.createElement('li');
        li.className = 'live-hit-item';

        const link = document.createElement('a');
        link.href = ev.url || '#';
        link.target = '_blank';
        link.rel = 'noopener';
        const prefix = ev.id_type && ev.id_type !== 'username' ? '[' + ev.id_type + '] ' : '';
        link.textContent = prefix + ev.site + ' (' + ev.username + ')';
        li.appendChild(link);

        if (ev.keyword_match) {
            const badge = document.createElement('span');
            badge.className = 'kw-hit-badge';
            badge.textContent = '[++]';
            badge.title = 'Keyword match found on page';
            li.appendChild(badge);
        }

        list.appendChild(li);
    }

    function addFound(ev) {
        ensureGraph();
        const uId = 'u:' + (ev.id_type || 'username') + ':' + ev.username.toLowerCase();
        const uLabel = ev.id_type && ev.id_type !== 'username'
            ? ev.username + ' (' + ev.id_type + ')'
            : ev.username;
        addNode(uId, uLabel, 'username');
        const sId = 's:' + ev.site;
        const siteGroup = ev.keyword_match ? 'site_kw' : 'site';
        const siteLabel = ev.keyword_match ? '[++] ' + ev.site : ev.site;
        addNode(sId, siteLabel, siteGroup, { url: ev.url, title: ev.url });
        addEdge(uId, sId);
        for (const [k, v] of Object.entries(ev.ids || {})) {
            if (SKIP_ID.test(k) || String(v).length > 80) continue;
            const vId = k + ':' + String(v).toLowerCase();
            addNode(vId, shortLabel(v), 'data', { title: k + ': ' + v });
            addEdge(sId, vId);
        }
        appendLiveHit(ev);
    }

    function finish(statusText, redirect) {
        document.getElementById('live-status').textContent = statusText;
        document.getElementById('live-progress').style.width = '100%';
        document.getElementById('stopBtn').disabled = true;
        if (redirect) {
            const btn = document.getElementById('analyzeBtn');
            btn.href = redirect;
            btn.style.display = 'inline-block';
        }
    }

    function stopScan() {
        fetch('/api/scan/' + jobId + '/stop', { method: 'POST' });
        document.getElementById('live-status').textContent = 'Stopping…';
        document.getElementById('stopBtn').disabled = true;
    }

    function onScanEvent(e) {
        const ev = JSON.parse(e.data);
        const statusEl = document.getElementById('live-status');
        if (ev.type === 'start') {
            document.getElementById('stat-total').textContent = ev.total;
            const label = ev.id_type && ev.id_type !== 'username'
                ? ev.username + ' (' + ev.id_type + ')'
                : ev.username;
            statusEl.textContent = 'Scanning ' + label + '…';
        } else if (ev.type === 'progress') {
            document.getElementById('stat-checked').textContent = ev.checked;
            if (typeof ev.errors === 'number') {
                errorCount = ev.errors;
                document.getElementById('stat-errors').textContent = errorCount;
            }
            if (ev.total) {
                const pct = Math.min(ev.checked, ev.total) / ev.total * 100;
                document.getElementById('live-progress').style.width = pct + '%';
            }
        } else if (ev.type === 'found') {
            foundCount++;
            document.getElementById('stat-found').textContent = foundCount;
            if (ev.keyword_match) {
                keywordCount++;
                document.getElementById('stat-keywords').textContent = keywordCount;
            }
            addFound(ev);
        } else if (ev.type === 'stopped') {
            statusEl.textContent = 'Stopped.';
        } else if (ev.type === 'error') {
            statusEl.textContent = 'Error: ' + ev.message;
        } else if (ev.type === 'done') {
            streamFinished = true;
            if (evtSource) {
                evtSource.close();
                evtSource = null;
            }
            if (typeof ev.found_count === 'number' && ev.found_count > foundCount) {
                foundCount = ev.found_count;
                document.getElementById('stat-found').textContent = foundCount;
            }
            let text = ev.redirect
                ? 'Completed — ' + foundCount + ' accounts found.'
                : 'Completed — nothing to analyze.';
            if (errorCount > 0 && foundCount === 0) {
                text += ' (' + errorCount + ' connection/DNS errors — check network access or proxy)';
            }
            finish(text, ev.redirect);
        }
    }

    document.getElementById('stopBtn').addEventListener('click', stopScan);

    if (doneRedirect) {
        document.getElementById('stat-found').textContent = foundCount;
        finish('Completed — ' + foundCount + ' accounts found.', doneRedirect);
    } else {
        evtSource = new EventSource('/api/scan/' + jobId + '/stream');
        evtSource.onmessage = onScanEvent;
        evtSource.onerror = function () {
            if (streamFinished && evtSource) {
                evtSource.close();
                evtSource = null;
            }
        };
    }
</script>
{% endblock %}
